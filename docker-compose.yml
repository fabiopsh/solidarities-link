version: "3.9"

services:
   # ============ PostgreSQL ============
   postgres:
      image: postgres:16-alpine
      container_name: soli-postgres
      environment:
         POSTGRES_DB: ${POSTGRES_DB:-soli_db}
         POSTGRES_USER: ${POSTGRES_USER:-soli}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soli_password}
      ports:
         - "${POSTGRES_PORT:-5433}:5432"
      volumes:
         - postgres_data:/var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U soli -d soli_db"]
         interval: 5s
         timeout: 5s
         retries: 10
      networks:
         - soli-network

   # ============ Keycloak ============
   keycloak:
      image: quay.io/keycloak/keycloak:26.0
      container_name: soli-keycloak
      command:
         - start-dev
         - --import-realm
      environment:
         KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
         KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
         KC_DB: postgres
         KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-soli_db}
         KC_DB_USERNAME: ${POSTGRES_USER:-soli}
         KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-soli_password}
         KC_HEALTH_ENABLED: "true"
         KC_HTTP_ENABLED: "true"
         KC_HTTP_PORT: "8080"
      ports:
         - "${KEYCLOAK_PORT:-8180}:8080"
      volumes:
         - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
         - ./keycloak/themes/soli:/opt/keycloak/themes/soli:ro
      depends_on:
         postgres:
            condition: service_healthy
      deploy:
         resources:
            limits:
               memory: 1024M
      networks:
         - soli-network

   # ============ Backend (Quarkus) ============
   soli-backend:
      build:
         context: ./soli-backend
         dockerfile: Dockerfile
         network: host
      container_name: soli-backend
      environment:
         QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
         QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-soli_db}
         QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-soli}
         QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-soli_password}
         QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/soli
         QUARKUS_OIDC_CLIENT_ID: ${QUARKUS_OIDC_CLIENT_ID:-soli-backend}
         QUARKUS_OIDC_CREDENTIALS_SECRET: ${QUARKUS_OIDC_CREDENTIALS_SECRET:-soli-backend-secret}
         QUARKUS_OIDC_TOKEN_ISSUER: any
         QUARKUS_OIDC_TLS_VERIFICATION: none
         QUARKUS_HTTP_CORS_ORIGINS: /.*/
      ports:
         - "${BACKEND_PORT:-8080}:8080"
      depends_on:
         postgres:
            condition: service_healthy
         keycloak:
            condition: service_started
      networks:
         - soli-network

   # ============ Frontend (React) ============
   soli-frontend:
      build:
         context: ./soli-frontend
         dockerfile: Dockerfile
         network: host
         args:
            VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180/realms/soli}
            VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-soli-frontend}
      container_name: soli-frontend
      ports:
         - "${FRONTEND_PORT:-5173}:80"
      depends_on:
         - soli-backend
      networks:
         - soli-network

volumes:
   postgres_data:

networks:
   soli-network:
      driver: bridge
