# ============================================
# SOLI Backend - Application Configuration
# ============================================

# --- Application ---
quarkus.application.name=soli-backend
quarkus.log.category."it.soli.security".level=DEBUG
quarkus.log.category."it.soli.resource".level=DEBUG
quarkus.log.file.enable=true
quarkus.log.file.path=target/soli-backend.log
quarkus.log.file.level=DEBUG

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- CORS ---
quarkus.http.cors.enabled=true
# Allow any origin: /.../ is a regex; Quarkus echoes back the caller's actual Origin
# (never literal *), so the public Open Data API is callable from anywhere while keeping
# access-control-allow-credentials=true spec-valid.
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin,x-auth-token,x-api-key
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# --- Datasource (PostgreSQL) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=soli
quarkus.datasource.password=soli_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/soli_db

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# --- OIDC (Keycloak) ---
quarkus.oidc.auth-server-url=http://localhost:8180/realms/soli
quarkus.oidc.client-id=soli-backend
quarkus.oidc.credentials.secret=soli-backend-secret
quarkus.oidc.tls.verification=none
quarkus.oidc.token.issuer=any

# Allow all paths by default, protect specific ones in code
quarkus.http.auth.permission.public.paths=/api/health,/q/*
quarkus.http.auth.permission.public.policy=permit
# Open Data API: permitted at OIDC level, gated by OpenDataApiKeyFilter (X-API-Key)
quarkus.http.auth.permission.open.paths=/api/open/*
quarkus.http.auth.permission.open.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# WebSocket chat - auth is handled manually via token in query string
quarkus.http.auth.permission.ws-chat.paths=/chat/*
quarkus.http.auth.permission.ws-chat.policy=permit

# --- Docker Compose profile overrides ---
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/soli_db
%prod.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/soli
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.log.sql=false

# --- FARO integration (emergency management platform, simulated) ---
# mode=mock: FaroClient responses are simulated in-memory by MockFaroClient.
soli.faro.enabled=true
soli.faro.mode=mock
soli.faro.base-url=https://faro.example.it
soli.faro.heartbeat-every=60s
soli.faro.stream-poll-every=15s
soli.faro.safety-radius-meters=1500
# Institutional SOLI account on FARO's Gestore Autenticazione (verified reporter)
soli.faro.username=soli-platform
soli.faro.password=soli-faro-demo
# Public engage endpoint SOLI declares in FARO's service registry
soli.faro.engage-endpoint=https://api.soli.it/api/integrations/faro/engage
# Key presented by FARO's Binder when calling the engage endpoint (POC; target: OAuth2 client credentials, FR-22)
soli.faro.engage-api-key=faro-binder-demo-key
quarkus.http.auth.permission.faro-engage.paths=/api/integrations/faro/engage
quarkus.http.auth.permission.faro-engage.policy=permit

# --- Urban Sentinel integration (structural health monitoring, simulated) ---
soli.urban-sentinel.enabled=true
soli.urban-sentinel.mode=mock
soli.urban-sentinel.base-url=http://urban-sentinel.local:8080/api/v1
soli.urban-sentinel.username=soli-integration
soli.urban-sentinel.password=soli-us-demo
soli.urban-sentinel.lookback-days=90
soli.urban-sentinel.min-magnitude=3.8
soli.urban-sentinel.near-task-radius-meters=500
soli.urban-sentinel.cache-seconds=60
