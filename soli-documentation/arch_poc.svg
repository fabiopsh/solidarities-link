<svg viewBox="0 0 1160 650" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img">
<title>Architettura POC SOLI</title>
<desc>Diagramma C4-container dell'architettura POC realizzata di Solidarities Link: 4 container Docker Compose (soli-frontend, soli-backend, keycloak, postgres) piu client mobile esterno non containerizzato.</desc>
<defs>
  <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
  </marker>
  <symbol id="p-browser" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="11" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="1" y1="5.2" x2="15" y2="5.2" stroke="currentColor" stroke-width="1.1"/><circle cx="3.2" cy="3.6" r="0.6" fill="currentColor"/><circle cx="5.2" cy="3.6" r="0.6" fill="currentColor"/></symbol>
  <symbol id="p-phone" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="12.4" r="0.9" fill="currentColor"/></symbol>
  <symbol id="p-chip" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="6" y1="1" x2="6" y2="4" stroke="currentColor" stroke-width="1.1"/><line x1="10" y1="1" x2="10" y2="4" stroke="currentColor" stroke-width="1.1"/><line x1="6" y1="12" x2="6" y2="15" stroke="currentColor" stroke-width="1.1"/><line x1="10" y1="12" x2="10" y2="15" stroke="currentColor" stroke-width="1.1"/><line x1="1" y1="6" x2="4" y2="6" stroke="currentColor" stroke-width="1.1"/><line x1="1" y1="10" x2="4" y2="10" stroke="currentColor" stroke-width="1.1"/><line x1="12" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1.1"/><line x1="12" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="1.1"/></symbol>
  <symbol id="p-key" viewBox="0 0 16 16"><circle cx="5" cy="5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="7.3" y1="7.3" x2="14" y2="14" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="10.5" x2="12.7" y2="8.3" stroke="currentColor" stroke-width="1.3"/><line x1="12.2" y1="12.2" x2="14.2" y2="10.2" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="p-db" viewBox="0 0 16 16"><ellipse cx="8" cy="3.2" rx="6" ry="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2,3.2 L2,12.8 A6,2.2 0 0,0 14,12.8 L14,3.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2,8 A6,2.2 0 0,0 14,8" fill="none" stroke="currentColor" stroke-width="1.1"/></symbol>
  <symbol id="p-spark" viewBox="0 0 16 16"><path d="M8,1 L9.5,6.5 L15,8 L9.5,9.5 L8,15 L6.5,9.5 L1,8 L6.5,6.5 Z" fill="currentColor"/></symbol>
</defs>

<rect x="0" y="0" width="1160" height="650" fill="#FFFFFF"/>

<!-- Docker Compose boundary -->
<rect x="260" y="30" width="760" height="560" rx="12" fill="none" stroke="#1E3A5F" stroke-width="1.6" stroke-dasharray="8,5"/>
<text x="640" y="608" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E3A5F">Docker Compose &#8212; 4 container: postgres, keycloak, soli-backend, soli-frontend</text>

<!-- Client Mobile (esterno, non containerizzato) -->
<rect x="50" y="50" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="145" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Client Mobile</text>
<use href="#p-phone" x="109" y="86" width="12" height="12" style="color:#1E3A5F"/>
<text x="125" y="94" font-size="10.5" fill="#444">React Native</text>
<text x="145" y="110" text-anchor="middle" font-size="9" fill="#777">[non containerizzato]</text>

<!-- Client Web -->
<rect x="430" y="50" width="220" height="70" rx="8" fill="#48A999"/>
<text x="540" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Client Web</text>
<use href="#p-browser" x="494" y="86" width="12" height="12" style="color:#EAF6F3"/>
<text x="510" y="94" font-size="11.5" fill="#EAF6F3">React SPA</text>
<text x="540" y="110" text-anchor="middle" font-size="10" fill="#DFF2ED">soli-frontend &#183; Nginx</text>

<!-- Backend Quarkus -->
<rect x="280" y="190" width="460" height="190" rx="10" fill="#00796B"/>
<text x="510" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Backend Quarkus</text>
<use href="#p-chip" x="475" y="224" width="12" height="12" style="color:#CFEDE6"/>
<text x="491" y="232" font-size="11.5" fill="#CFEDE6">Java 21 &#183; soli-backend</text>

<rect x="305" y="250" width="95" height="66" rx="6" fill="#00594F"/>
<text x="352" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">REST API +</text>
<text x="352" y="285" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">WS Chat</text>
<text x="352" y="300" text-anchor="middle" font-size="9" fill="#BFE3DB">sync, realtime</text>

<rect x="410" y="250" width="95" height="66" rx="6" fill="#00594F"/>
<text x="457" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Matching</text>
<text x="457" y="285" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Haversine</text>
<text x="457" y="300" text-anchor="middle" font-size="9" fill="#BFE3DB">in-memory</text>

<rect x="515" y="250" width="95" height="66" rx="6" fill="#00594F"/>
<text x="562" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Reward &amp;</text>
<text x="562" y="285" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Audit</text>
<text x="562" y="300" text-anchor="middle" font-size="9" fill="#BFE3DB">crediti, log</text>

<rect x="620" y="250" width="95" height="66" rx="6" fill="#5C5C5C" stroke="#FFFFFF" stroke-width="1.3" stroke-dasharray="4,3"/>
<use href="#p-spark" x="661" y="256" width="13" height="13" style="color:#EDEDED"/>
<text x="667" y="290" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff">MockAIService</text>
<text x="667" y="305" text-anchor="middle" font-size="8.5" fill="#DADADA">LLM placeholder</text>

<text x="305" y="345" font-size="9.5" fill="#CFEDE6">Nessun Notification Service dispiegato in questa PoC.</text>

<!-- Keycloak -->
<rect x="800" y="210" width="200" height="90" rx="8" fill="#1E3A5F"/>
<text x="900" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Keycloak 26</text>
<use href="#p-key" x="854" y="246" width="12" height="12" style="color:#D7DFEA"/>
<text x="870" y="254" font-size="11" fill="#D7DFEA">OIDC / JWT</text>
<text x="900" y="270" text-anchor="middle" font-size="9" fill="#C6D1E1">[realm: soli]</text>

<!-- PostgreSQL -->
<rect x="460" y="460" width="260" height="110" rx="8" fill="#B32424"/>
<text x="590" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PostgreSQL 16</text>
<use href="#p-db" x="544" y="496" width="12" height="12" style="color:#F6D3D3"/>
<text x="560" y="504" font-size="11" fill="#F6D3D3">soli_db</text>
<text x="590" y="522" text-anchor="middle" font-size="9.5" fill="#F0BFBF">utenti, task, crediti, audit,</text>
<text x="590" y="536" text-anchor="middle" font-size="9.5" fill="#F0BFBF">chat, geolocalizzazione</text>

<!-- ===== EDGES: ortogonali, nessun box sovrastato ===== -->
<path d="M145,120 L145,155 L310,155 L310,190" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrowP)"/>
<path d="M540,120 L540,190" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrowP)"/>
<path d="M740,255 L800,255" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrowP)"/>
<path d="M510,380 L510,460" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrowP)"/>
<path d="M900,300 L900,420 L720,420 L720,460" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrowP)"/>

<!-- ===== LEGEND ===== -->
<rect x="1030" y="440" width="120" height="120" rx="6" fill="#F2F5F8" stroke="#BFBFBF"/>
<text x="1042" y="458" font-size="10" font-weight="700" fill="#1E3A5F">Legenda</text>
<line x1="1042" y1="475" x2="1072" y2="475" stroke="#333" stroke-width="1.6" marker-end="url(#arrowP)"/>
<text x="1042" y="490" font-size="8.5" fill="#333">sincrono (REST/WS)</text>
<rect x="1042" y="502" width="20" height="12" rx="2" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2"/>
<text x="1042" y="527" font-size="8.5" fill="#333">non containerizzato</text>
<text x="1042" y="538" font-size="8.5" fill="#333">/ mock (placeholder)</text>

</svg>
