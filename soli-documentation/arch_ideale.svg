<path d="M720,116 L720,148 L545,148 L545,180" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M550,213 L610,213" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M440,246 L440,310" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M760,310 L760,246" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="768" y="280" font-size="9.5" fill="#555">valida token</text>
<path d="M760,345 L800,345" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M760,475 L800,475" stroke="#333" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)"/>
<path d="M215,510 L215,600" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
