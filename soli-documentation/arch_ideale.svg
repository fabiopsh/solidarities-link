<path d="M510,510 L510,600" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M745,510 L745,560 L830,560 L830,600" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M800,345 L780,345 L780,600" stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M340,615 L340,545 L900,545 L900,510" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow)"/>

<!-- ===== LEGEND ===== -->
<rect x="960" y="600" width="185" height="80" rx="6" fill="#F2F5F8" stroke="#BFBFBF"/>
<text x="975" y="618" font-size="10.5" font-weight="700" fill="#1E3A5F">Legenda frecce</text>
<line x1="975" y1="635" x2="1010" y2="635" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1017" y="639" font-size="9.5" fill="#333">sincrono (REST)</text>
<line x1="975" y1="655" x2="1010" y2="655" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="1017" y="659" font-size="9.5" fill="#333">asincrono (evento)</text>

</svg>
